[project]
name = "2pac"
version = "0.2.0"
description = "Hardware control, telemetry logging, and automation GUI for the 2PAC Adiabatic Demagnetization Refrigerator (ADR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "labjackpython>=2.1.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pyqt5>=5.15.10",
    "pyserial>=3.5",
    "python-xlib>=0.33",
    "pyvisa>=1.14.0",
    "pyvisa-py>=0.8.0",
    "qcodes>=0.50.0",
    "qdarkstyle>=3.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
